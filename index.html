<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tostão</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tostão">
<meta name="theme-color" content="#0E3B35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<style>:root{color-scheme:light;padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#F3F5F2}img{max-width:100%}[hidden]{display:none!important}*{-webkit-touch-callout:none}input,textarea{-webkit-touch-callout:default}</style>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Recomeço (21/10/2026, pedido dele: "apaga tudo e vamos do 0 função por função"). Só ficam: o cartão do topo, os cartões
   disponíveis (cores e letras) e os leitores de PDF (fatura, boleto/conta e holerite). */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#13201D; --muted:#5E6E69; --line:#DDE3DF; --chip:#E8EEEB;
  --head:#0E3B35; --head-ink:#EAF4F0; --accent:#12A57E; --accent-ink:#FFFFFF; --neg:#C2412D; --pos:#0F8F6C; --warn:#B36E0C;
  --hc:var(--head); --tci:#FFFFFF;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C1513; --surface:#15211E; --ink:#E6EEEB; --muted:#93A6A0; --line:#24332F; --chip:#1E2C28;
  --head:#0F2E29; --accent:#2BC496; --accent-ink:#06231B; --neg:#F07462; --pos:#3FD1A3; --warn:#E8A23A; color-scheme:dark}}
*{box-sizing:border-box;touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(60px + env(safe-area-inset-bottom,0px))}

/* ---------- cartão do topo ---------- */
header.top{margin:calc(env(safe-area-inset-top,0px) + 8px) 0 0;padding:14px;border-radius:32px;background:color-mix(in srgb,var(--hc) 22%,var(--bg));transition:background .3s}
.tcard{position:relative;overflow:hidden;border-radius:22px;padding:18px 20px;color:var(--tci);
  background:linear-gradient(135deg,var(--hc) 0%,color-mix(in srgb,var(--hc) 58%,#000) 100%);box-shadow:0 12px 28px -4px rgba(0,0,0,.35);transition:background .3s}
.tcard::after{content:"";position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22) 0%,transparent 70%);pointer-events:none}
.tcard::before{content:"";display:block;width:32px;height:24px;border-radius:6px;margin-bottom:12px;background:linear-gradient(135deg,#e6c875 0%,#b59132 100%);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.tcard>*{position:relative;z-index:1}
.tcard h1{margin:0 0 2px;font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em;line-height:1.2}
.tcard .bigrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px}
.tcard .label{margin:0;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;opacity:.82;font-weight:600}
.tcard .big{font-family:var(--display);font-weight:700;font-size:1.65rem;line-height:1.15;letter-spacing:-.02em}
.tcard .big small{font-size:.62em;margin-right:3px;opacity:.85}
.tcard .split{position:absolute;right:20px;bottom:18px;text-align:right}
.tcard .split span{display:block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;opacity:.82;font-weight:600}
.tcard .split b{font-family:var(--display);font-size:1.65rem;line-height:1.15;letter-spacing:-.02em}
@media (max-width:410px){.tcard .big,.tcard .split b{font-size:1.3rem}}
@media (max-width:380px){.tcard .split{position:static;text-align:left;margin-top:10px}}

/* ---------- letras dos bancos ---------- */
.fi{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;font-family:var(--display);font-weight:800;letter-spacing:-.035em;line-height:1;text-align:center;white-space:nowrap;overflow:hidden;
  font-size:calc(.95rem * var(--k,1));box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){.fi{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}}

/* ---------- seções ---------- */
.sec{margin-top:26px;padding:0 4px}
.sec>h2{margin:0 0 10px;font-family:var(--display);font-weight:700;font-size:1.22rem;letter-spacing:-.01em}
.sec .hint{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.cards{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.cpill{flex:none;display:flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
.cpill .fi{width:30px;height:30px;border-radius:50%}
.cpill[aria-pressed="true"]{border-color:var(--ink)}
.cpill.add{padding:6px 16px 6px 6px;border-style:dashed;color:var(--muted)}
.cpill.add .fi{background:var(--chip);color:var(--ink);font-size:1.2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;border:0;background:var(--chip);font-weight:600;text-align:center}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.wide{width:100%}
.reads{margin-top:14px;display:grid;gap:8px}
.reads div{display:flex;flex-direction:column;font-size:.92rem}
.reads small{color:var(--muted);font-size:.82rem}

/* ---------- janelas ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));z-index:21;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:700px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:28px;max-height:84vh}}
.sheet[hidden],.scrim[hidden]{display:none}
.auth{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;text-align:center;
  --gold:#D9B66F;--gold2:#B8924D;--navy:#1C2A46;--cream:#F6EFE0;--soft:#A9B3C7;
  background:radial-gradient(120% 70% at 50% 0%,#2A3F69 0%,#1C2A46 52%,#121C32 100%);color:var(--cream);color-scheme:dark}
.auth[hidden]{display:none}
.noauth .wrap{display:none}
.authbox{width:100%;max-width:380px;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.alogo{display:block;width:104px;height:104px;margin:0 auto 18px;border-radius:24px;box-shadow:0 0 0 1.5px rgba(217,182,111,.45),0 18px 40px -8px rgba(0,0,0,.6),0 0 48px -6px rgba(217,182,111,.35)}
.authbox h1{margin:0 0 26px;font-family:var(--display);font-size:2.4rem;letter-spacing:-.02em;color:var(--cream)}
.authbox p{margin:0 0 24px;color:var(--soft)}
.authbox .field{text-align:left}
.authbox .field>label{color:var(--gold)}
.auth .field input[type=email],.auth .field input[type=password]{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1.5px solid rgba(217,182,111,.32);background:rgba(255,255,255,.06);color:var(--cream)}
.auth .field input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,182,111,.2)}
.authbox .btn{background:transparent;border:1.5px solid rgba(217,182,111,.55);color:var(--gold)}
.authbox .btn.primary{background:linear-gradient(180deg,#E6C987,#C9A25A);border-color:transparent;color:#1C2A46}
.authbox .btn:disabled{opacity:.6}
.authbox .btn+.btn{margin-top:10px}
.or{display:flex;align-items:center;gap:12px;margin:16px 0 6px;color:var(--soft);font-size:.85rem}.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(217,182,111,.28)}
#auGoogle{color:var(--cream)}
#auGoogle svg{flex:none}
#authMsg{min-height:1.3em;margin:0 0 12px;color:#FF9C8A;font-size:.92rem}
#meBtn{margin-left:auto}
.mekv{margin:0 0 16px;color:var(--muted)}
.mekv b{color:var(--ink)}
.sheet .btn+.btn{margin-top:10px}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;font-family:var(--display);font-size:1.25rem}
.sheet .x{width:36px;height:36px;border-radius:50%;border:0;background:var(--chip)}
.field{margin:0 0 14px}
.field>label,.field>.lbl{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.field input[type=text]{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg)}
.bpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bpick .bsub{grid-column:1/-1;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
.bpick button{display:grid;justify-items:center;gap:5px;padding:9px 2px 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:.72rem;font-weight:600;line-height:1.15;min-width:0}
.bpick button span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.bpick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.bpick button:disabled{opacity:.4}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:12px;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.err{color:var(--neg);font-size:.9rem;margin:0 0 10px;min-height:0}
.err:empty{display:none}

/* ---------- o que o leitor achou ---------- */
.rd{border:1px solid var(--line);border-radius:18px;padding:0 14px;margin-bottom:12px}
.rd>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;font-weight:700;cursor:pointer}
.rd>summary::-webkit-details-marker{display:none}
.rd>summary small{font-weight:500;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:2px 0 12px;font-size:.94rem}
.kv span{color:var(--muted)}.kv b{text-align:right}
.ok,.kv .ok{color:var(--pos)}.bad,.kv .bad{color:var(--neg)}
.ln{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.ln.h2{grid-template-columns:1fr auto}
.ln span:first-child{color:var(--muted);font-size:.82rem}
.ln b{font-weight:600;white-space:nowrap}
.ln .cr{color:var(--pos)}
.ln .dsc{overflow-wrap:anywhere}
.ln.sub{border-top:0;padding-top:12px;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;grid-template-columns:1fr}
.diagtxt{width:100%;font:12px/1.35 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(90vw,420px);padding:12px 18px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.92rem;z-index:30;text-align:center}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- base de banco ---------- */
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;min-height:0}
.tb{border:0;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:600;color:inherit;background:color-mix(in srgb,currentColor 18%,transparent)}
.tb[hidden]{display:none}
.trow:not(:has(.tb:not([hidden]))){display:none}
.acrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-radius:18px;background:var(--surface);padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 0 var(--line)}
.acrow .fi{width:40px;height:40px;border-radius:12px}
.acrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acrow b{font-family:var(--display);font-size:1.05rem;white-space:nowrap}
.acrow.add{background:none;box-shadow:none;border:1.5px dashed var(--line);color:var(--muted)}
.acrow.add .fi{background:var(--chip);color:var(--ink);font-size:1.3rem}
.dayh{margin:16px 0 4px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ex{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 0;border-bottom:1px solid var(--line)}
.ex i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--chip)}
.ex i.rec{color:var(--pos)}
.ex .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex b{white-space:nowrap;font-weight:600}.ex b.cr{color:var(--pos)}
.hl{padding:6px 0 14px}.hl .lbl{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 0 6px}
.mcard{position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;min-height:96px;margin-bottom:16px;padding:14px 16px;border-radius:18px;color:var(--tci);
  background:linear-gradient(135deg,var(--hc) 0%,color-mix(in srgb,var(--hc) 58%,#000) 100%);box-shadow:0 8px 20px -6px rgba(0,0,0,.35)}
.mcard .mchip{position:absolute;left:16px;top:14px;width:28px;height:21px;border-radius:5px;background:linear-gradient(135deg,#e6c875 0%,#b59132 100%)}
.mcard b{font-family:var(--display);font-size:1.15rem}
.mcard .fi{width:30px;height:30px;border-radius:9px}
.field input[type=date]{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg)}
#exDel{margin-top:14px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 4px 0}
.acts button{display:grid;justify-items:center;gap:7px;border:0;background:none;font-size:.8rem;font-weight:600}
.acts i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:0 1px 0 var(--line),0 6px 16px -8px rgba(0,0,0,.25)}
.acts svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--chip);margin-bottom:6px}
.seg button{min-height:42px;border:0;border-radius:12px;background:none;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.bigamt{display:flex;align-items:center;gap:8px;margin:14px 0 12px}
.bigamt span{font-family:var(--display);font-size:1.3rem;opacity:.6}
.bigamt input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-family:var(--display);font-weight:700;font-size:2.6rem;letter-spacing:-.03em;padding:0}
.swatch.custom{position:relative;display:block;background:conic-gradient(#e33,#ea3,#3c6,#39e,#93e,#e33);overflow:hidden}
.swatch.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.swatch.custom:has(input:focus-visible){border-color:var(--ink)}
.sec .acrow+.acrow{margin-top:0}
</style>

<div class="auth" id="auth" hidden>
  <form class="authbox" id="authForm" novalidate>
    <img class="alogo" src="icon-512.png?v=2" alt="" width="104" height="104"><h1>Tostão</h1>
    <div class="field"><label for="auEmail">E-mail</label><input type="email" id="auEmail" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false"></div>
    <div class="field"><label for="auPass">Senha</label><input type="password" id="auPass" autocomplete="current-password"></div>
    <div id="authMsg" role="alert"></div>
    <button type="submit" class="btn primary wide" id="auIn">Entrar</button>
    <button type="button" class="btn wide" id="auNew">Criar conta</button>
    <div class="or"><span>ou</span></div>
    <button type="button" class="btn wide" id="auGoogle"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.2 1-3.8 1-2.9 0-5.3-2-6.2-4.6H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14c-.2-.7-.4-1.3-.4-2s.1-1.4.4-2V7.2H2.1a11 11 0 0 0 0 9.6z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.1 7.2L5.8 10c.9-2.6 3.3-4.6 6.2-4.6z"/></svg>Entrar com o Google</button>
  </form>
</div>

<div class="wrap">
  <header class="top">
    <div class="tcard" id="tcard">
      <div class="trow"><button type="button" class="tb" id="meBtn" hidden>☁</button><button type="button" class="tb" id="back" hidden>‹ Contas</button><button type="button" class="tb" id="editCard" hidden>Personalizar</button></div>
      <h1 id="ptitle">Minhas contas</h1>
      <div class="bigrow"><div><p class="label" id="bigLabel">Comece por aqui</p><div class="big" id="big">Sem contas</div></div></div>
      <div class="split" id="split" hidden><span id="s1l">Entrou</span><b id="s1">—</b></div>
    </div>
  </header>

  <main id="view"></main>

  <section class="sec" id="secPdf">
    <h2>Ler um PDF</h2>
    <label class="btn primary wide" id="pdfBtn"><span>Escolher PDF (holerite, fatura ou conta)</span><input type="file" id="pdfIn" accept="application/pdf,.pdf" multiple hidden></label>
    <div class="reads" id="reads"></div>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const PWA=true;
/* ---------- utilitários ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=c=>(c/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const R=c=>"R$ "+brl(c);
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const shiftYM=(ym,d)=>{let[y,m]=ym.split("-").map(Number);m+=d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+pad(m)};
const lastDay=ym=>{const[y,m]=ym.split("-").map(Number);return new Date(y,m,0).getDate()};
const fmtD=s=>s?s.slice(8)+"/"+s.slice(5,7)+"/"+s.slice(0,4):"";
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const fold=t=>(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

/* ---------- bancos: cor e sigla, escritas na fonte do app (sem logos nem fontes dos bancos) ---------- */
const BANKS=[
 {m:/nubank|^nu$/,c:"#820AD1",l:"Nu"},{m:/inter/,c:"#FF5A00",l:"Inter"},{m:/ita[uú]/,c:"#EC7000",l:"Itaú"},

      const v=[...l.cells].reverse().find(c=>money(c.s)!=null&&c.x>=px-30);if(!v)continue;
      const d=l.cells.find(c=>/\p{L}/u.test(c.s));if(!d)continue;
      ev.push({desc:d.s,cents:money(v.s),side:v.x>=mid?"d":"p"})}}
  const P=ev.filter(e=>e.side==="p"), big=P.slice().sort((a,b)=>b.cents-a.cents)[0], bd=big?fold(big.desc).toUpperCase():"";
  let kind="Salário";

  else if(/ADIANT/.test(bd)&&!P.some(e=>/HORAS NORMAIS|SALARIO/.test(fold(e.desc).toUpperCase()))) kind="Adiantamento";
  let ref=null;if(mr){const m=/(\d{1,2})\s*\/\s*(\d{4})/.exec(mr);ref=`${m[2]}-${String(m[1]).padStart(2,"0")}`}

  let conv=null;
  for(const pg of pages){const CL=pdfLines(pg), cf=CL.map(l=>l.cells.map(c=>c.s).join(" ")).join(" ");

    const at=[];CL.forEach(l=>{if(l.t>=tl.t)return;const dc=l.cells.find(c=>/^\d{2}\/\d{2}\/\d{4}$/.test(c.s)), mc=[...l.cells].reverse().find(c=>money(c.s)!=null);
      if(dc&&mc){const[d,m,y]=dc.s.split("/");at.push({date:`${y}-${m}-${d}`,cents:money(mc.s),code:(l.cells.find(c=>/^\d{8}$/.test(c.s))||{}).s||"",txt:l.cells.filter(c=>c.x>dc.x-200&&c.x<dc.x&&/\p{L}/u.test(c.s)).map(c=>c.s).join(" ")})}
      else if(at.length&&!mc)at[at.length-1].txt+=" "+l.cells.map(c=>c.s).join(" ")});

    at.forEach(a=>{const k=convKind(a.txt,a.code);(by[k]=by[k]||{k,cents:0,n:0});by[k].cents+=a.cents;by[k].n++});

  const cp=ev.find(e=>e.side==="d"&&/COPARTICIPA|CONVENIO/.test(fold(e.desc).toUpperCase()));

function convKind(t,code){const u=fold(t).toUpperCase();

  if(/PRONTO.?SOCORRO|EMERGENCIA|URGENCIA/.test(u)) return "Pronto-socorro";
  if(/CONSULTA|PSIQUIATR|^1010/.test(u)||/^1010/.test(code)) return "Médico";
  if(/EXAME|HEMOGRAMA|DOSAGEM|RAIO|RX\b|ULTRA.?SON|ULTRASS|RESSONAN|TOMOGRAF|ELETRO|ENDOSCOP|COLESTEROL|GLICOSE/.test(u)||/^4/.test(code)) return "Exames";

function pdfInfo(b,file){
  let t="";const n=b.length;for(let i=0;i<n;i+=8192)t+=String.fromCharCode.apply(null,b.subarray(i,Math.min(n,i+8192)));

  const g=(re)=>{const m=ed&&re.exec(ed[0]);return m?m[1]:"-"};
  const hex=Array.from(b.subarray(0,16),x=>x.toString(16).padStart(2,"0")).join(" ");
  const sx=/startxref\s+(\d+)\s*%%EOF\s*$/.exec(t.slice(-1024));
  return {tipo:file.type||"?",kb:Math.round(n/1024),bytes:n,head,hex,off,ver:off>=0?t.substr(off,8):"-",startxref:sx?+sx[1]:-1,
    fim:t.slice(-16).replace(/[^\x20-\x7e]/g,"?"),pdf:/^%PDF-/.test(t.slice(0,1024))?1:0,
    enc:enc?`sim (filtro ${g(/\/Filter\s*\/([A-Za-z.]+)/)} V=${g(/\/V\s+(\d+)/)} R=${g(/\/R\s+(\d+)/)} bits=${g(/\/Length\s+(\d+)/)} cf=${g(/\/CFM\s*\/(\w+)/)})`:"não",
    eof:(t.match(/%%EOF/g)||[]).length,objstm:/\/ObjStm/.test(t)?1:0,xrefstm:/\/Type\s*\/XRef/.test(t)?1:0,
    producer:(/\/Producer\s*\(([^)]{0,40})/.exec(t)||[,"?"])[1].replace(/[^\x20-\x7e]/g,"?")};
}

function diagTok(w){
  const n=w.toLowerCase().replace(/^[(\[{"“']+|[)\]}"”':;,.!?]+$/g,"");
  if(!/[\p{L}\d]/u.test(n)) return w;
  if(/^[+-]?(r\$)?-?\d{1,3}(\.\d{3})*,\d{2}$/.test(n)) return w;
  if(/^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/.test(n)||/^\d{1,2}:\d{2}$/.test(n)||/^\d{1,4}$/.test(n)) return w;
  if(/bancointer|inter\.co|bancopan/.test(n)||DIAG_KEEP.has(n)) return w;
  return w.replace(/\d/g,"#").replace(/\p{Lu}/gu,"X").replace(/\p{Ll}/gu,"x");
}

    res?`leitura: banco=${res.bank||"?"} vence=${res.due||"?"} itens=${res.rows.length} soma=${R(res.rows.reduce((s,r)=>s+r.cents,0))}`:`erro: ${e||"?"}`];

  if(t.closest("[data-close]")){closeSheet();return}
  const o=t.closest("[data-open]");if(o){openId=o.dataset.open;renderAll();scrollTo(0,0);return}
  if(t.closest("#back")){openId=null;renderAll();scrollTo(0,0);return}
  if(t.closest("#acctNew")){openAddSheet();return}
  if(t.closest("#editCard")){openEditSheet();return}
  const x=t.closest("[data-ex]");if(x){openEntrySheet(x.dataset.ex);return}
  const dx=t.closest("#exDel");if(dx){armed(dx,"Toque de novo para apagar",()=>{{const ee=entries.find(y=>y.id===dx.dataset.id);entries=entries.filter(y=>y.id!==dx.dataset.id&&!(ee&&ee.tr&&y.tr===ee.tr))};saveAll();closeSheet();renderAll();toast("Lançamento apagado")});return}
  const da=t.closest("#acctDel");if(da){armed(da,"Toque de novo: apaga a conta e o extrato",()=>{const id=openId;accts=accts.filter(a=>a.id!==id);entries=entries.filter(y=>y.acct!==id);saveAll();openId=null;renderAll();toast("Conta apagada")});return}
  /* nova conta */
  if($("sheet").querySelector("#cdSave")){
    const b=t.closest("[data-bpick]");
    if(b&&!b.disabled){keepAdd();cdPicked=b.dataset.bpick;if(cdPicked){cdName=cdPicked;const k=bankOf(cdPicked);if(k)cdColor=k.c}else cdName="";
      openSheet(addSheetHtml());if(cdPicked==="")setTimeout(()=>$("cdName")?.focus(),60);return}
    const s=t.closest("[data-color]");if(s){keepAdd();cdColor=s.dataset.color;openSheet(addSheetHtml());return}
    if(t.closest("#cdSave")){
      const nm=$("cdName"),name=(cdPicked===""?(nm?nm.value:""):cdName).trim().replace(/\s+/g," ");
      if(cdPicked===null){$("cdErr").textContent="Escolha o banco ou toque em Outro.";return}
      if(!name){$("cdErr").textContent="Dê um nome à conta.";return}
      if(name.toLowerCase()==="outro"||accts.some(c=>c.name.toLowerCase()===name.toLowerCase())){$("cdErr").textContent="Já existe uma conta com esse nome.";return}
      const a={id:uid(),name,color:cdColor,start:digits($("cdBal").value)};accts.push(a);saveAll();closeSheet();openId=a.id;renderAll();scrollTo(0,0);toast("Conta "+name+" criada");return}
  }
  /* personalizar */
  if($("sheet").querySelector("#edSave")){
    const s=t.closest("[data-edcolor]");if(s){ed.color=s.dataset.edcolor;edPrev();return}
    if(t.closest("#edSave")){
      const name=ed.name.trim().replace(/\s+/g," ");

      if(accts.some(c=>c.id!==openId&&c.name.toLowerCase()===name.toLowerCase())){$("edErr").textContent="Já existe uma conta com esse nome.";return}
      const a=accOf(openId);a.name=name;a.label=ed.label;a.color=ed.color;a.start=digits($("edBal").value);saveAll();closeSheet();renderAll();toast("Cartão atualizado");return}
  }
});

/* ---------- ler PDF ---------- */
const READS=[["Faturas de cartão","Inter, Pan, PicPay e Renner/Realize"],
  ["Contas e boletos","Claro, Vivo, TIM, Oi, Enel, CPFL, Elektro, Sabesp e Comgás"],
  ["Holerite","demonstrativo de pagamento (salário, adiantamento, 13º, férias) com o extrato do convênio"]];
$("reads").innerHTML=READS.map(([a,b])=>`<div><b>${a}</b><small>${b}</small></div>`).join("")+`<small style="color:var(--muted)">Use sempre o PDF original do banco, sem converter, comprimir ou escanear. O PDF é lido no próprio aparelho.</small>`;

async function openPdf(file){
  let bytes=new Uint8Array(await file.arrayBuffer());const info=pdfInfo(bytes,file);
  if(info.off>0) bytes=bytes.subarray(info.off); /* alguns apps põem lixo antes do %PDF */
  const L=await loadPdfJs(), task=L.getDocument({data:bytes});
  task.onPassword=(cb,reason)=>{info.senha=(info.senha||0)+1;const pw=prompt(reason===2?"Senha incorreta. Digite a senha do PDF:":"Este PDF tem senha. Digite a senha (geralmente parte do CPF):");if(pw==null){info.cancelou=1;task.destroy();return}cb(pw)};
  const doc=await task.promise, pages=[];
  for(let n=1;n<=doc.numPages;n++){const pg=await doc.getPage(n),vp=pg.getViewport({scale:1}),tc=await pg.getTextContent();
    pages.push({h:vp.height,w:vp.width,items:tc.items.map(i=>({s:i.str,x:i.transform[4],w:i.width,t:vp.height-i.transform[5]}))})}
  return {pages,info};
}
/* um PDF → {kind:"holerite"|"fatura"|"conta"|"erro", ...}; ordem do app anterior: holerite, fatura, conta */
async function readOne(file){
  const out={name:file.name};let pdf=null;
  try{
    pdf=await openPdf(file);out.pdf=pdf;lastPdf=pdf;
    if(!pdf.pages.some(pg=>pg.items.some(i=>i.s.trim()))){out.kind="erro";out.msg=`Esse PDF não tem texto, só imagem${/ilovepdf|scan|camscanner|adobe scan/i.test(pdf.info.producer)?` (passou pelo ${pdf.info.producer})`:""}. Use o PDF original do banco, sem converter, comprimir ou escanear.`;return out}
    const h=parseHolerite(pdf.pages);if(h){out.kind="holerite";out.h=h;return out}
    const r=parseInvoice(pdf.pages);pdf.res=r;
    if(r.rows.length){out.kind="fatura";out.r=r;return out}
    const c=parseConta(pdf.pages);if(c){out.kind="conta";out.c=c;return out}
    out.kind="erro";out.msg="Não reconheci esse PDF como fatura de cartão, conta ou holerite.";return out;
  }catch(e){
    out.kind="erro";
    if(e&&e.message==="offline")out.msg="Sem internet para carregar o leitor de PDF.";
    else if(pdf&&pdf.info&&pdf.info.cancelou)out.msg="Leitura cancelada.";
    else{out.msg=pdf?"O leitor travou nesse PDF.":"Não deu para abrir esse PDF.";lastPdf={pages:(pdf&&pdf.pages)||[],info:pdf&&pdf.info,err:`${e&&e.name||"Erro"}: ${e&&e.message||e}`};out.pdf=lastPdf}
    return out}
}
const fmtDM=d=>d?d.slice(8)+"/"+d.slice(5,7):"";
function viewFatura(x,i){
  const r=x.r, sum=r.rows.reduce((s,y)=>s+y.cents,0), b=bankOf(r.bank||"");
  const chk=r.total==null?"":Math.abs(sum-r.total)<=1?`<span class="ok">bate com o total do banco ✓</span>`:`<span class="bad">banco diz ${R(r.total)}</span>`;
  const nm=y=>{let n=(y.shop||y.desc||"").trim();if(n&&n===n.toUpperCase()&&/[A-Z]{3}/.test(n))n=titleCase(n);return n};
  return `<details class="rd" open><summary><span>${r.bank?cardBadge(r.bank)+" ":""}Fatura ${esc(r.bank||"")} <small>${esc(x.name)}</small></span></summary>
    <div class="kv"><span>Vencimento</span><b>${r.due?fmtD(r.due):"não achei"}</b>${r.close?`<span>Fecha dia</span><b>${r.close}</b>`:""}<span>Lançamentos</span><b>${r.rows.length}</b><span>Soma lida</span><b>${R(sum)}</b>${r.total!=null?`<span>Total do banco</span><b>${R(r.total)}</b>`:""}</div>

    ${r.rows.map(y=>`<div class="ln"><span>${fmtDM(y.date)}</span><span class="dsc">${esc(nm(y))}</span><b class="${y.cents<0?"cr":""}">${R(y.cents)}</b></div>`).join("")}${ftBlock(x,i)}</details>`;
}
function viewConta(x,i){const c=x.c;
  return `<details class="rd" open><summary><span>Conta ${esc(c.name)} <small>${esc(x.name)}</small></span></summary>
    <div class="kv"><span>Empresa</span><b>${esc(c.name)}</b><span>Vencimento</span><b>${fmtD(c.due)}</b><span>Valor</span><b>${R(c.cents)}</b><span>Débito automático</span><b>${c.auto?"sim":"não"}</b></div>${ctBlock(x,i)}</details>`}
/* nome do evento do holerite: siglas (PLR, I.N.S.S.) ficam em maiúsculas */
const hlName=d=>d.split(/(\s+)/).map(w=>/^(?:\p{L}\.)+\p{L}?\.?$|^\p{Lu}{2,3}$/u.test(w)&&!/^(DE|DO|DA|E)$/.test(w)?w:titleCase(w)).join("");
function viewHolerite(x,i){const h=x.h;
  const P=h.ev.filter(e=>e.side==="p"), D=h.ev.filter(e=>e.side==="d");
  return `<details class="rd" open><summary><span>Holerite · ${esc(h.kind)} <small>${esc(x.name)}</small></span></summary>
    <div class="kv"><span>Líquido</span><b>${R(h.cents)}</b><span>Crédito em</span><b>${fmtD(h.date)}</b><span>Referência</span><b>${h.ref.slice(5)}/${h.ref.slice(0,4)}</b>${h.emp?`<span>Empresa</span><b>${esc(h.emp)}</b>`:""}
      ${h.tp!=null?`<span>Proventos</span><b>${R(h.tp)}</b>`:""}${h.td!=null?`<span>Descontos</span><b>${R(h.td)}</b>`:""}
      ${h.check==null?"":`<span>Conferência</span><b>${h.check?`<span class="ok">proventos − descontos = líquido ✓</span>`:`<span class="bad">não bate com o líquido</span>`}</b>`}
      ${h.conv?`<span>Convênio</span><b>${R(h.conv.cents)}${h.conv.n?` · ${h.conv.n} atend.`:""}</b>`:""}</div>
    ${h.conv&&h.conv.by&&h.conv.by.length?h.conv.by.map(b=>`<div class="ln h2"><span>${esc(b.k)} · ${b.n}</span><b>${R(b.cents)}</b></div>`).join(""):""}
    ${P.length?`<div class="ln sub">Proventos</div>`+P.map(e=>`<div class="ln h2"><span class="dsc" style="color:var(--ink);font-size:.92rem">${esc(hlName(e.desc))}</span><b>${R(e.cents)}</b></div>`).join(""):""}
    ${D.length?`<div class="ln sub">Descontos</div>`+D.map(e=>`<div class="ln h2"><span class="dsc" style="color:var(--ink);font-size:.92rem">${esc(hlName(e.desc))}</span><b>${R(e.cents)}</b></div>`).join(""):""}${hlBlock(x,i)}</details>`}

/* fatura: vira UMA despesa na conta que paga, na data do vencimento (agendada até lá; some do saldo no dia). Os itens ficam dentro do lançamento. */
const ftTotal=r=>r.total!=null?r.total:r.rows.reduce((s,y)=>s+y.cents,0);
const ftKey=(r,d)=>`fatura-${r.bank||"cartao"}-${d}`;
function ftBlock(x,i){

  if(!x.acct||!accOf(x.acct)){const m=bankOf(r.bank||"");x.acct=(m&&(accts.find(a=>bankOf(a.name)===m)||{}).id)||(openId&&accOf(openId)?openId:accts[0].id)}
  const a=accOf(x.acct), c=ftTotal(r);
  return `<div class="hl" data-hl="${i}">${r.due?"":`<div class="field"><label for="ftd${i}">Vencimento (não achei no PDF)</label><input type="date" id="ftd${i}" data-ftdate="${i}" value="${esc(x.date||"")}"></div>`}

    <button type="button" class="btn primary wide" data-ftgo="${i}">Lançar fatura de ${R(c)} em ${esc(a.name)}${d?` · vence ${fmtDM(d)}`:""}</button></div>`;

/* ---------- login e banco de dados (Supabase) ----------
   Login por e-mail e senha (GoTrue) e tabelas accts/entries (supabase/schema.sql), tudo por fetch, sem biblioteca.
   A chave "publishable" pode ficar no repositório: quem protege os dados é o RLS (cada usuário só vê o que é dele).
   Os dados continuam no aparelho (funciona sem internet); a cada mudança o app compara com `base` (o que já subiu),
   envia o que mudou (apagados e novos/alterados) e depois baixa tudo do banco, que é a verdade. */
const SB_URL="https://ndsiayzschaefigobwag.supabase.co", SB_KEY="sb_publishable_W_wX4ECguxH-Ay86y1bHfQ_MAKWhTHz";
const SES_K="despesas.zero.ses", BASE_K="despesas.zero.base";
let ses=null;try{ses=JSON.parse(lsGet(SES_K)||"null")}catch(e){ses=null}
const sesSave=v=>{ses=v;lsSet(SES_K,v?JSON.stringify(v):null)};
const SY={p:null,again:false,off:false,err:"",at:0,t:0};
const sbErr=(r,j)=>Object.assign(new Error((j&&(j.msg||j.error_description||j.message||j.error))||("http "+r.status)),{status:r.status,code:(j&&(j.error_code||j.code))||""});
async function gt(path,body){const r=await fetch(SB_URL+"/auth/v1/"+path,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw sbErr(r,j);return j}
const toSes=j=>({at:j.access_token,rt:j.refresh_token,exp:Date.now()+((+j.expires_in||3600)-60)*1e3,uid:(j.user&&j.user.id)||(ses&&ses.uid)||"",email:(j.user&&j.user.email)||(ses&&ses.email)||""});
async function tok(){if(!ses)throw Object.assign(new Error("sem login"),{status:401});
  if(Date.now()<ses.exp)return ses.at;
  try{const j=await gt("token?grant_type=refresh_token",{refresh_token:ses.rt});sesSave(toSes(j));return ses.at}
  catch(e){if(e.status>=400&&e.status<500){sesSave(null);showAuth("A sessão acabou. Entre de novo.")}throw e}}
async function api(method,path,body,prefer){const t=await tok();
  const r=await fetch(SB_URL+"/rest/v1/"+path,{method,headers:{apikey:SB_KEY,Authorization:"Bearer "+t,"Content-Type":"application/json",...(prefer?{Prefer:prefer}:{})},body:body?JSON.stringify(body):undefined});
  if(r.status===401){ses.exp=0;throw Object.assign(new Error("401"),{status:401})}
  if(!r.ok){const j=await r.json().catch(()=>({}));throw sbErr(r,j)}
  return r.status===204?null:await r.json().catch(()=>null)}
const MERGE="resolution=merge-duplicates,return=minimal";
async function getAll(tbl){const out=[];for(let o=0;;o+=1000){const p=await api("GET",`${tbl}?select=*&order=id&limit=1000&offset=${o}`)||[];out.push(...p);if(p.length<1000)return out}}
async function upsert(tbl,rows){for(let i=0;i<rows.length;i+=200){const part=rows.slice(i,i+200);
  try{await api("POST",tbl+"?on_conflict=id",part,MERGE)}
  catch(e){if(e.code!=="23505")throw e; /* mesmo holerite/fatura/conta já lançado em outro aparelho: o banco recusa a repetição e fica o que já estava lá */
    for(const r of part){try{await api("POST",tbl+"?on_conflict=id",[r],MERGE)}catch(x){if(x.code!=="23505")throw x}}}}}
const idList=a=>"in.("+a.map(i=>'"'+encodeURIComponent(i)+'"').join(",")+")";
async function delIds(tbl,ids){for(let i=0;i<ids.length;i+=100)await api("DELETE",tbl+"?id="+idList(ids.slice(i,i+100)))}
const aRow=a=>({id:a.id,name:a.name,color:a.color||null,label:a.label||null,start_cents:a.start||0});
const aFrom=r=>({id:r.id,name:r.name,color:r.color||CARD_PALETTE[0],...(r.label?{label:r.label}:{}),start:+r.start_cents||0});
const eRow=e=>({id:e.id,acct:e.acct,type:e.type,cents:e.cents,date:e.date,descr:e.desc||"",imp:e.imp||null,xfer:!!e.xfer,tr:e.tr||null,items:e.items||null,at:e.at||null});
const eFrom=r=>{const e={id:r.id,acct:r.acct,type:r.type,cents:+r.cents,date:r.date,desc:r.descr||""};if(r.imp)e.imp=r.imp;if(r.xfer)e.xfer=1;if(r.tr)e.tr=r.tr;if(r.items)e.items=r.items;if(r.at!=null)e.at=+r.at;return e};
const rowsMap=()=>{const m={a:{},e:{}};accts.forEach(a=>{m.a[a.id]=JSON.stringify(aRow(a))});entries.forEach(e=>{m.e[e.id]=JSON.stringify(eRow(e))});return m};
const baseGet=()=>{try{const b=JSON.parse(lsGet(BASE_K)||"null");return b&&b.a&&b.e?b:{a:{},e:{}}}catch(e){return{a:{},e:{}}}};
function pending(){const b=baseGet(),m=rowsMap();let n=0;for(const k of["a","e"]){for(const id in m[k])if(b[k][id]!==m[k][id])n++;for(const id in b[k])if(!(id in m[k]))n++}return n}
function syncSoon(){if(!ses)return;clearTimeout(SY.t);SY.t=setTimeout(syncNow,1200);window.__ps()}
window.__sy=syncSoon;
function syncNow(){
  if(!ses)return Promise.resolve();
  if(SY.p){SY.again=true;return SY.p}
  SY.p=(async()=>{
    try{
      const b=baseGet(), m=rowsMap();
      const upA=accts.filter(a=>b.a[a.id]!==m.a[a.id]).map(aRow), upE=entries.filter(e=>b.e[e.id]!==m.e[e.id]).map(eRow);
      const delA=Object.keys(b.a).filter(id=>!(id in m.a)), delE=Object.keys(b.e).filter(id=>!(id in m.e));
      if(delE.length)await delIds("entries",delE);
      if(delA.length)await delIds("accts",delA);
      if(upA.length)await upsert("accts",upA);
      if(upE.length)await upsert("entries",upE);
      const ra=await getAll("accts"), re=await getAll("entries");
      if(!ses)return;
      if(JSON.stringify(rowsMap())!==JSON.stringify(m)){SY.again=true}   /* mexeram enquanto o banco respondia: não sobrescreve, tenta de novo */
      else{
        const na=ra.map(aFrom), ne=re.map(eFrom), old=JSON.stringify([accts,entries]);
        accts=na;entries=ne;
        const ch=JSON.stringify([accts,entries])!==old;
        saveRaw();lsSet(BASE_K,JSON.stringify(rowsMap()));
        if(ch){if(openId&&!accOf(openId))openId=null;renderAll()}
      }
      SY.off=false;SY.err="";SY.at=Date.now();
    }catch(e){
      if(e&&e.status===401&&!ses){}
      else if(!e||e.status==null){SY.off=true}   /* fetch sem resposta = sem internet */
      else{SY.err=(e.message||"erro").slice(0,80)}
    }
    SY.p=null;
    if(SY.again){SY.again=false;syncSoon()}
    window.__ps();
  })();
  window.__ps();
  return SY.p;
}
function syncTxt(){if(!ses)return"";const n=pending();
  return SY.p?"Sincronizando…":SY.err?"Erro ao sincronizar":SY.off?(n?n+" para enviar · sem internet":"Sem conexão"):n?n+" para enviar":"Em dia"}
window.__ps=()=>{const b=$("meBtn");if(b){b.textContent="☁ "+(syncTxt()||"Conta");b.hidden=!ses||!!openId}
  const t=$("meState");if(t)t.textContent=syncTxt()};
setInterval(()=>{if(ses&&!document.hidden)syncNow()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&ses)syncNow()});
addEventListener("online",()=>{if(ses)syncNow()});
/* entrar / criar conta */
function showAuth(msg){document.querySelector('meta[name="theme-color"]')?.setAttribute("content","#1C2A46");document.body.classList.add("noauth");$("auth").hidden=false;$("authMsg").textContent=msg||"";closeSheet()}
function hideAuth(){document.body.classList.remove("noauth");$("auth").hidden=true;$("authMsg").textContent=""}
function authErr(e){const m=String(e&&e.message||""),c=e&&e.code||"";
  return /invalid_credentials/.test(c)||/invalid login/i.test(m)?"E-mail ou senha incorretos.":
    /user_already_exists/.test(c)||/already registered/i.test(m)?"Esse e-mail já tem conta. Toque em Entrar.":
    /email_not_confirmed/.test(c)?"Confirme o e-mail primeiro (veja a caixa de entrada).":
    /weak_password/.test(c)?"Senha fraca. Use pelo menos 8 caracteres, com letras e números.":
    /rate_limit/.test(c)||(e&&e.status===429)?"Muitas tentativas. Espere alguns minutos.":
    /signup_disabled/.test(c)?"O cadastro está desativado no Supabase.":
    !e||e.status==null?"Sem conexão. Tente de novo.":m||"Não deu para entrar."}
async function doAuth(create){
  const email=$("auEmail").value.trim().toLowerCase(), pw=$("auPass").value, msg=t=>{$("authMsg").textContent=t};
  if(!/^\S+@\S+\.\S+$/.test(email)){msg("Digite um e-mail válido.");return}
  if(pw.length<6){msg("A senha precisa de 6 ou mais caracteres.");return}
  const bs=[$("auIn"),$("auNew")];bs.forEach(x=>x.disabled=true);msg("");
  try{
    if(create){const j=await gt("signup",{email,password:pw});
      if(!j.access_token){msg("Conta criada. Confirme pelo e-mail e depois toque em Entrar.");return}
      sesSave(toSes(j))}
    else sesSave(toSes(await gt("token?grant_type=password",{email,password:pw})));
    $("auPass").value="";hideAuth();renderAll();syncNow()
  }catch(e){msg(authErr(e))}
  finally{bs.forEach(x=>x.disabled=false)}
}
$("authForm").addEventListener("submit",e=>{e.preventDefault();doAuth(false)});
$("auNew").addEventListener("click",()=>doAuth(true));
/* Google: vai para a página do Google (pelo Supabase) e volta para cá com o token no endereço (#access_token=…) */
const G_REDIR=location.origin+location.pathname.replace(/index\.html$/,"");
$("auGoogle").addEventListener("click",()=>{$("authMsg").textContent="Abrindo o Google…";
  location.href=SB_URL+"/auth/v1/authorize?provider=google&redirect_to="+encodeURIComponent(G_REDIR)});
const G_BACK=/access_token=|error_description=/.test(location.hash+location.search);
if(G_BACK)(async()=>{const p=new URLSearchParams(location.hash.slice(1)), q=new URLSearchParams(location.search);
  history.replaceState(null,"",location.pathname);
  const er=p.get("error_description")||q.get("error_description");
  if(er){showAuth("Google: "+er.replace(/\+/g," "));return}
  try{const at=p.get("access_token");if(!at)throw 0;
    const r=await fetch(SB_URL+"/auth/v1/user",{headers:{apikey:SB_KEY,Authorization:"Bearer "+at}});if(!r.ok)throw 0;const u=await r.json();
    sesSave({at,rt:p.get("refresh_token")||"",exp:Date.now()+((+p.get("expires_in")||3600)-60)*1e3,uid:u.id||"",email:u.email||""});
    hideAuth();renderAll();syncNow()}
  catch(e){showAuth("Não deu para entrar com o Google. Tente de novo.")}})();
/* janela "Sua conta" */
function openMe(){openSheet(sheetHead("Sua conta")+`<p class="mekv">Entrou como <b>${esc(ses.email||"")}</b><br><span id="meState">${esc(syncTxt())}</span></p>
  <button type="button" class="btn wide" id="meSync">Sincronizar agora</button>
  <button type="button" class="btn wide" id="meOut">Sair</button>`)}
document.addEventListener("click",async e=>{const t=e.target;if(!t.closest)return;
  if(t.closest("#meBtn")){openMe();return}
  if(t.closest("#meSync")){toast("Sincronizando…");await syncNow();toast(SY.err?"Erro: "+SY.err:SY.off?"Sem conexão":"Tudo em dia ✓",true);return}
  const o=t.closest("#meOut");if(o)armed(o,"Toque de novo para sair",async()=>{
    await syncNow();
    if(pending()||SY.off||SY.err){toast("Há mudanças que ainda não subiram. Conecte e tente de novo.");return}
    try{await fetch(SB_URL+"/auth/v1/logout",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+ses.at}})}catch(x){}   /* invalida a sessão no Supabase também */
    accts=[];entries=[];saveRaw();lsSet(BASE_K,null);sesSave(null);openId=null;renderAll();showAuth("")})});
if(!ses&&!G_BACK)showAuth("");

renderAll();
if(ses)syncNow();
if(PWA&&"serviceWorker" in navigator&&(location.protocol==="https:"||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))) navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update()})}).catch(()=>{});
/* iOS: no app da tela de início o touch-action às vezes é ignorado. O 2º toque rápido no mesmo lugar vira um clique normal (sem zoom); campos de texto ficam de fora. Também bloqueia a pinça. */
(()=>{let last=0,lx=0,ly=0;
  document.addEventListener("touchend",e=>{const t=e.changedTouches&&e.changedTouches[0];if(!t)return;const n=Date.now();
    if(n-last<350&&Math.abs(t.clientX-lx)<40&&Math.abs(t.clientY-ly)<40&&!e.target.closest("input,textarea,select,[contenteditable]")){e.preventDefault();(e.target.closest("button,a,label")||e.target).click()}
    last=n;lx=t.clientX;ly=t.clientY},{passive:false});
  ["gesturestart","gesturechange"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
})();

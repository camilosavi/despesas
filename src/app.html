<title>Minhas Despesas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Despesas">
<meta name="theme-color" content="#0E3B35">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Recomeço (21/10/2026, pedido dele: "apaga tudo e vamos do 0 função por função"). Só ficam: o cartão do topo, os cartões
   disponíveis (cores e letras) e os leitores de PDF (fatura, boleto/conta e holerite). */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#13201D; --muted:#5E6E69; --line:#DDE3DF; --chip:#E8EEEB;
  --head:#0E3B35; --head-ink:#EAF4F0; --accent:#12A57E; --accent-ink:#FFFFFF; --neg:#C2412D; --pos:#0F8F6C; --warn:#B36E0C;
  --hc:var(--head); --tci:#FFFFFF;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C1513; --surface:#15211E; --ink:#E6EEEB; --muted:#93A6A0; --line:#24332F; --chip:#1E2C28;
  --head:#0F2E29; --accent:#2BC496; --accent-ink:#06231B; --neg:#F07462; --pos:#3FD1A3; --warn:#E8A23A; color-scheme:dark}}
*{box-sizing:border-box;touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(60px + env(safe-area-inset-bottom,0px))}

/* ---------- cartão do topo ---------- */
header.top{margin:calc(env(safe-area-inset-top,0px) + 8px) 0 0;padding:14px;border-radius:32px;background:color-mix(in srgb,var(--hc) 22%,var(--bg));transition:background .3s}
.tcard{position:relative;overflow:hidden;border-radius:22px;padding:18px 20px;color:var(--tci);
  background:linear-gradient(135deg,var(--hc) 0%,color-mix(in srgb,var(--hc) 58%,#000) 100%);box-shadow:0 12px 28px -4px rgba(0,0,0,.35);transition:background .3s}
.tcard::after{content:"";position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22) 0%,transparent 70%);pointer-events:none}
.tcard::before{content:"";display:block;width:32px;height:24px;border-radius:6px;margin-bottom:12px;background:linear-gradient(135deg,#e6c875 0%,#b59132 100%);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.tcard>*{position:relative;z-index:1}
.tcard h1{margin:0 0 2px;font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em;line-height:1.2}
.tcard .bigrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px}
.tcard .label{margin:0;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;opacity:.82;font-weight:600}
.tcard .big{font-family:var(--display);font-weight:700;font-size:1.65rem;line-height:1.15;letter-spacing:-.02em}
.tcard .big small{font-size:.62em;margin-right:3px;opacity:.85}
.tcard .split{position:absolute;right:20px;bottom:18px;text-align:right}
.tcard .split span{display:block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;opacity:.82;font-weight:600}
.tcard .split b{font-family:var(--display);font-size:1.65rem;line-height:1.15;letter-spacing:-.02em}
@media (max-width:410px){.tcard .big,.tcard .split b{font-size:1.3rem}}
@media (max-width:380px){.tcard .split{position:static;text-align:left;margin-top:10px}}

/* ---------- letras dos bancos ---------- */
.fi{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;font-family:var(--display);font-weight:800;letter-spacing:-.035em;line-height:1;text-align:center;white-space:nowrap;overflow:hidden;
  font-size:calc(.95rem * var(--k,1));box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){.fi{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}}

/* ---------- seções ---------- */
.sec{margin-top:26px;padding:0 4px}
.sec>h2{margin:0 0 10px;font-family:var(--display);font-weight:700;font-size:1.22rem;letter-spacing:-.01em}
.sec .hint{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.cards{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.cpill{flex:none;display:flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
.cpill .fi{width:30px;height:30px;border-radius:50%}
.cpill[aria-pressed="true"]{border-color:var(--ink)}
.cpill.add{padding:6px 16px 6px 6px;border-style:dashed;color:var(--muted)}
.cpill.add .fi{background:var(--chip);color:var(--ink);font-size:1.2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;border:0;background:var(--chip);font-weight:600;text-align:center}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.wide{width:100%}
.reads{margin-top:14px;display:grid;gap:8px}
.reads div{display:flex;flex-direction:column;font-size:.92rem}
.reads small{color:var(--muted);font-size:.82rem}

/* ---------- janelas ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));z-index:21;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:700px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:28px;max-height:84vh}}
.sheet[hidden],.scrim[hidden]{display:none}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;font-family:var(--display);font-size:1.25rem}
.sheet .x{width:36px;height:36px;border-radius:50%;border:0;background:var(--chip)}
.field{margin:0 0 14px}
.field>label,.field>.lbl{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.field input[type=text]{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg)}
.bpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bpick .bsub{grid-column:1/-1;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
.bpick button{display:grid;justify-items:center;gap:5px;padding:9px 2px 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:.72rem;font-weight:600;line-height:1.15;min-width:0}
.bpick button span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.bpick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.bpick button:disabled{opacity:.4}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:12px;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.err{color:var(--neg);font-size:.9rem;margin:0 0 10px;min-height:0}
.err:empty{display:none}

/* ---------- o que o leitor achou ---------- */
.rd{border:1px solid var(--line);border-radius:18px;padding:0 14px;margin-bottom:12px}
.rd>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;font-weight:700;cursor:pointer}
.rd>summary::-webkit-details-marker{display:none}
.rd>summary small{font-weight:500;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:2px 0 12px;font-size:.94rem}
.kv span{color:var(--muted)}.kv b{text-align:right}
.ok,.kv .ok{color:var(--pos)}.bad,.kv .bad{color:var(--neg)}
.ln{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.ln.h2{grid-template-columns:1fr auto}
.ln span:first-child{color:var(--muted);font-size:.82rem}
.ln b{font-weight:600;white-space:nowrap}
.ln .cr{color:var(--pos)}
.ln .dsc{overflow-wrap:anywhere}
.ln.sub{border-top:0;padding-top:12px;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;grid-template-columns:1fr}
.diagtxt{width:100%;font:12px/1.35 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(90vw,420px);padding:12px 18px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.92rem;z-index:30;text-align:center}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="tcard" id="tcard">
      <h1 id="ptitle">Minhas Despesas</h1>
      <div class="bigrow"><div><p class="label" id="bigLabel">Cartões</p><div class="big" id="big">Sem cartões</div></div></div>
      <div class="split" id="split" hidden><span id="s1l">Vence</span><b id="s1">—</b></div>
    </div>
  </header>

  <section class="sec">
    <h2>Seus cartões</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section class="sec">
    <h2>Ler um PDF</h2>
    <label class="btn primary wide" id="pdfBtn"><span>Escolher PDF (fatura, boleto ou holerite)</span><input type="file" id="pdfIn" accept="application/pdf,.pdf" multiple hidden></label>
    <div class="reads" id="reads"></div>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const PWA=false;
/* ---------- utilitários ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=c=>(c/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const R=c=>"R$ "+brl(c);
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const shiftYM=(ym,d)=>{let[y,m]=ym.split("-").map(Number);m+=d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+pad(m)};
const lastDay=ym=>{const[y,m]=ym.split("-").map(Number);return new Date(y,m,0).getDate()};
const fmtD=s=>s?s.slice(8)+"/"+s.slice(5,7)+"/"+s.slice(0,4):"";
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const fold=t=>(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

/* ---------- bancos: cor e sigla, escritas na fonte do app (sem logos nem fontes dos bancos) ---------- */
const BANKS=[
 {m:/nubank|^nu$/,c:"#820AD1",l:"Nu"},{m:/inter/,c:"#FF5A00",l:"Inter"},{m:/ita[uú]/,c:"#EC7000",l:"Itaú"},
 {m:/bradesco/,c:"#E60028",l:"Brad"},{m:/santander/,c:"#DA291C",l:"Sant"},{m:/^c6/,c:"#242424",l:"C6"},
 {m:/banco do brasil|^bb$/,c:"#FFCC00",l:"BB"},{m:/caixa/,c:"#145EA8",l:"Caixa"},{m:/mercado ?pago/,c:"#1EA7E1",l:"MP"},
 {m:/picpay/,c:"#3DAD58",l:"Pic"},{m:/^xp/,c:"#1A1A1A",l:"XP"},{m:/^pan$|banco pan/,c:"#0266B2",l:"Pan"},
 {m:/renner|realize/,c:"#E31E24",l:"R"},{m:/revolut/,c:"#191C1F",l:"R"},{m:/neon/,c:"#0AA7C9",l:"Neon"},{m:/^next/,c:"#00C35A",l:"Next"},
 {m:/sicoob/,c:"#00786A",l:"Sic"},{m:/sicredi/,c:"#3FA535",l:"Sicr"},
 {m:/btg/,c:"#0B2E5A",l:"BTG"},{m:/pagbank|pagseguro/,c:"#FFC900",l:"Pag"},{m:/^wise/,c:"#9FE870",l:"Wise"},{m:/nomad/,c:"#FFD500",l:"Nomad"},{m:/^arq\b|dolarapp/,c:"#111111",l:"ARQ"},{m:/^ame\b/,c:"#E6007E",l:"Ame"},{m:/porto/,c:"#0055A4",l:"Porto"},
 {m:/alelo/,c:"#0A8F4A",l:"Alelo"},{m:/pluxee|sodexo/,c:"#14213D",l:"Plx"},{m:/^ticket/,c:"#D7141A",l:"Tkt"},{m:/^v[ra]\b/,c:"#00994D",l:"VR"},{m:/^flash/,c:"#F2295B",l:"Flash"},{m:/^caju/,c:"#FF6340",l:"Caju"},
 {m:/carrefour/,c:"#1E4C9A",l:"Carr"},{m:/riachuelo|midway/,c:"#E31B23",l:"Ria"},{m:/c&a|^cea$/,c:"#1D3C8F",l:"C&A"}];
const BANK_PICK=["Nubank","Itaú","Bradesco","Banco do Brasil","Caixa","Santander","Inter","C6","Mercado Pago","PicPay","PagBank","BTG","XP","Neon","Pan","Renner"];
const FX_PICK=["Wise","Nomad","ARQ","Revolut"];
const BEN_PICK=["Alelo","Pluxee","VR","Ticket","Flash","Caju"];
const bankOf=n=>{const t=(n||"").trim().toLowerCase();return t?BANKS.find(b=>b.m.test(t))||null:null};
const cardLabel=c=>{const b=bankOf(c);if(b)return b.l;const w=(c||"?").trim().split(/\s+/)[0];return w.length<=5?w:w.slice(0,3)};
function cardBadge(c){
  const col=cardColor(c), l=cardLabel(c), dark=lumHex(col)>.5, fs=l.length<=2?1:l.length===3?.88:l.length===4?.76:.66;
  return `<span class="fi" style="background:${col};color:${dark?"#1A1A1A":"#fff"};--k:${fs}">${esc(l)}</span>`;
}
const CARD_PALETTE=["#8A05BE","#E8730C","#2C6BD6","#C8102E","#0F8F6C","#1F1F1F","#D4A017","#6B7A75"];

/* ---------- leitores de PDF (copiados do app anterior, sem mexer na lógica) ---------- */
function parseInvoice(pages){
  const MONEY=/^-?\d{1,3}(\.\d{3})*,\d{2}$/, DATE=/^\d{2}\/\d{2}\/\d{4}$/;
  const toC=v=>{const neg=v.startsWith("-");return (neg?-1:1)*Number(v.replace(/[-.]/g,"").replace(",",""))};
  const iso=d=>{const[a,b,c]=d.split("/");return `${c}-${b}-${a}`};
  const all=pages.map(p=>p.items.map(i=>i.s).join(" ")).join(" \n ").replace(/\s+/g," ");
  if(/Banco Inter|bancointer|inter\.co\//i.test(all)) return parseInter(pages,all);
  if(/Banco Pan\b|bancopan/i.test(all)) return parsePan(pages,all);
  /* PicPay: "Fechamento: dd/mm/aaaa" com ano; a Renner/Realize também cita PicPay (onde pagar) e tem "Próximo Fechamento dd/mm" */
  if(/PicPay/i.test(all)&&!/Realize/i.test(all)&&/Fechamento:?\s*\d{2}\/\d{2}\/\d{4}/i.test(all)&&/Estabelecimento/i.test(all)) return parsePicPay(pages);
  const bank=/Realize|Renner/i.test(all)?"Renner":"";
  const dueM=/Vencimento:?\s*(\d{2}\/\d{2}\/\d{4})/i.exec(all);
  const due=dueM?iso(dueM[1]):"";
  const rows=[];let inSec=false,cols=null;
  for(const pg of pages){
    const it=[...pg.items].filter(i=>i.s.trim()).sort((a,b)=>a.t-b.t||a.x-b.x);
    let start=-1,end=Infinity;
    for(const i of it){
      if(start<0&&/Lançamentos detalhados|Lançamentos do período|Lançamentos:/i.test(i.s)) start=i.t;
      if(/Compras parceladas|Próximas Faturas|Total para as próximas/i.test(i.s)&&(start>=0||inSec)&&i.t>(start<0?-1:start)) {end=Math.min(end,i.t);}
    }
    if(start>=0) inSec=true;
    if(!inSec) continue;
    const est=it.find(i=>/^Estabelecimento$/i.test(i.s.trim())&&i.t>=start), val=it.find(i=>/^(Crédito\/|Valor|Débito|Valor \(R\$\))/i.test(i.s.trim())&&i.x>300&&i.t>=start);
    if(est||val) cols={est:est?est.x-25:null,val:val?val.x-20:null};
    const sec=it.filter(i=>i.t>(start<0?-1:start)&&i.t<end);
    const anchors=sec.filter(i=>DATE.test(i.s.trim())&&i.x<60);
    anchors.forEach((a,k)=>{
      const lo=a.t-5, hi=k+1<anchors.length?anchors[k+1].t-5:Math.min(end,a.t+30);
      const blk=sec.filter(i=>i.t>=lo&&i.t<hi&&i!==a);
      const valX=cols&&cols.val||460, estX=cols&&cols.est||300;
      const v=blk.filter(i=>i.x>=valX&&MONEY.test(i.s.trim().replace(/\s/g,""))).pop();
      if(!v) return;
      const desc=blk.filter(i=>i.x<estX&&i.x>=55).map(i=>i.s.trim()).join(" ").replace(/\s+/g," ").trim();
      const shop=blk.filter(i=>i.x>=estX&&i.x<valX).map(i=>i.s.trim()).join(" ").replace(/\s+/g," ").trim();
      rows.push({date:iso(a.s.trim()),desc,shop,cents:toC(v.s.trim().replace(/\s/g,""))});
    });
    if(end<Infinity) inSec=false;
  }
  return {bank,due,rows};
}
/* linhas da página: agrupa itens pela altura e junta pedaços da mesma palavra/frase em células */
function pdfLines(pg){
  const it=[...pg.items].filter(i=>i.s.trim()).sort((a,b)=>a.t-b.t||a.x-b.x), L=[];
  for(const i of it){const l=L.find(l=>Math.abs(l.t-i.t)<2);if(l)l.items.push(i);else L.push({t:i.t,items:[i]})}
  return L.map(l=>{const cells=[];l.items.sort((a,b)=>a.x-b.x).forEach(i=>{const c=cells[cells.length-1],gap=c?i.x-c.end:99;
    if(c&&gap<6){c.s+=(gap<1.5?"":" ")+i.s;c.end=i.x+(i.w||i.s.length*5)}else cells.push({s:i.s,x:i.x,end:i.x+(i.w||i.s.length*5)})});
    cells.forEach(c=>c.s=c.s.replace(/\s+/g," ").trim());return {t:l.t,cells}});
}
const moneyC=s=>{const m=/^(\+|-)?\s*R\$\s*(-)?\s*(\d{1,3}(?:\.\d{3})*,\d{2})$/.exec(s.trim());if(!m)return null;
  const v=Number(m[3].replace(/\./g,"").replace(",",""));return (m[1]||m[2])?-v:v};
const parcTag=(d,i,n)=>{if(d===d.toUpperCase())d=titleCase(d);return `${d} Parc. ${i}/${n}`};
function parseInter(pages,all){
  const MES={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
  const dm=/Vencimento[^0-9]{0,40}(\d{2})\/(\d{2})\/(\d{4})/i.exec(all), dx=!dm&&/Vencimento[^0-9]{0,40}(\d{1,2}) de ([a-zç]{3})[a-zç]*\.? (?:de )?(\d{4})/i.exec(all);
  const due=dm?`${dm[3]}-${dm[2]}-${dm[1]}`:dx&&MES[dx[2].toLowerCase()]?`${dx[3]}-${String(MES[dx[2].toLowerCase()]).padStart(2,"0")}-${dx[1].padStart(2,"0")}`:"";
  const rows=[];
  for(const pg of pages) for(const ln of pdfLines(pg)){
    const c=ln.cells, d=/^(\d{1,2}) de ([a-zç]{3})\.? (\d{4})$/i.exec(c[0]&&c[0].s||"");
    if(!d||!MES[d[2].toLowerCase()]) continue;
    let k=c.length-1;while(k>0&&moneyC(c[k].s)==null)k--;if(k<1) continue;
    let desc=c.slice(1,k).map(x=>x.s).filter(s=>s!=="-").join(" ");
    const p=/\(Parcela (\d+) de (\d+)\)/i.exec(desc);desc=desc.replace(/\s*\(Parcela \d+ de \d+\)/i,"").trim();
    rows.push({date:`${d[3]}-${String(MES[d[2].toLowerCase()]).padStart(2,"0")}-${d[1].padStart(2,"0")}`,
      desc:p?parcTag(desc,p[1],p[2]):desc,shop:"",cents:moneyC(c[k].s)});
  }
  /* total do banco e o que ficou da fatura anterior (pagamento parcial): o saldo entra como um item, senão a soma não bate */
  let total=null,pend=0;

    res?`leitura: banco=${res.bank||"?"} vence=${res.due||"?"} itens=${res.rows.length} soma=${R(res.rows.reduce((s,r)=>s+r.cents,0))}`:`erro: ${e||"?"}`];
  pages.forEach((pg,n)=>{out.push(`--- página ${n+1} (${Math.round(pg.w)}x${Math.round(pg.h)})`);
    pdfLines(pg).forEach(l=>out.push(`${Math.round(l.t)}| `+l.cells.map(c=>`${Math.round(c.x)}:${c.s.split(/\s+/).map(diagTok).join(" ")}`).join(" ¦ ")))});
  return out.join("\n");
}

/* ---------- cartões ---------- */
let PDFJS=null;
const hexRgb=h=>{h=(h||"").replace("#","");if(h.length===3)h=h.replace(/./g,"$&$&");const n=parseInt(h,16);return isNaN(n)?[107,122,117]:[n>>16&255,n>>8&255,n&255]};
const mixHex=(h,t,k)=>{const a=hexRgb(h),b=hexRgb(t);return "#"+a.map((v,i)=>Math.round(v+(b[i]-v)*k).toString(16).padStart(2,"0")).join("")};
const lumHex=h=>{const[r,g,b]=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b};
let cards={}, sel=null;
try{cards=JSON.parse(lsGet("despesas.zero.cards")||"{}")||{}}catch(e){cards={}}
sel=lsGet("despesas.zero.sel");if(!cards[sel])sel=null;
const saveCards=()=>{lsSet("despesas.zero.cards",JSON.stringify(cards));lsSet("despesas.zero.sel",sel)};
const cardColor=c=>(cards[c]||{}).color||(bankOf(c)||{}).c||"#6B7A75";
const cardNames=()=>Object.keys(cards);

/* o topo é o cartão: usa a cor do cartão aberto (ou a do tema) e escolhe texto claro ou escuro pelo contraste */
function paintTop(){
  const st=document.documentElement.style, tc=$("tcard");
  if(!sel){st.removeProperty("--hc");st.removeProperty("--tci");$("ptitle").textContent="Minhas Despesas";$("bigLabel").textContent="Cartões";
    $("big").textContent=cardNames().length?cardNames().length+(cardNames().length===1?" cartão":" cartões"):"Sem cartões";return}
  const col=cardColor(sel);st.setProperty("--hc",col);st.setProperty("--tci",lumHex(col)>.45?"#1A1A1A":"#FFFFFF");
  $("ptitle").textContent="Cartão";$("bigLabel").textContent="Banco";$("big").textContent=sel;
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content",col);
}
function renderCards(){
  $("cards").innerHTML=cardNames().map(c=>`<button type="button" class="cpill" data-sel="${esc(c)}" aria-pressed="${sel===c}">${cardBadge(c)}<span>${esc(c)}</span></button>`).join("")+
    `<button type="button" class="cpill add" id="cardNew"><span class="fi">+</span><span>Adicionar cartão</span></button>`;
  const del=$("cardDelRow");if(del)del.remove();
  if(sel)$("cards").insertAdjacentHTML("afterend",`<div id="cardDelRow"><button type="button" class="btn" id="cardDel">Apagar o cartão ${esc(sel)}</button></div>`);
  paintTop();
}
document.addEventListener("click",e=>{
  const p=e.target.closest("[data-sel]");if(p){sel=sel===p.dataset.sel?null:p.dataset.sel;saveCards();renderCards();return}
  if(e.target.closest("#cardNew")){openCardSheet();return}
  const d=e.target.closest("#cardDel");if(d){if(!d.dataset.arm){d.dataset.arm=1;d.textContent="Toque de novo para apagar";setTimeout(()=>{if(d.isConnected){delete d.dataset.arm;d.textContent="Apagar o cartão "+sel}},3000);return}
    delete cards[sel];sel=null;saveCards();renderCards();toast("Cartão apagado");return}
});

/* ---------- janelas ---------- */
function openSheet(html){$("sheet").innerHTML=html;$("scrim").hidden=$("sheet").hidden=false;$("sheet").scrollTop=0}
function closeSheet(){$("scrim").hidden=$("sheet").hidden=true;$("sheet").innerHTML=""}
$("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet()});
document.addEventListener("click",e=>{if(e.target.closest("[data-close]"))closeSheet()});
function toast(t,ok){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},3200)}

/* novo cartão: grade com os bancos (nome e cor já vêm), contas de câmbio, vale-refeição e "Outro" */
let cdPicked=null, cdColor=CARD_PALETTE[0], cdName="";
function cardSheetHtml(){
  const have=new Set(cardNames().map(c=>c.toLowerCase()));
  const btn=n=>`<button type="button" data-bpick="${esc(n)}" aria-pressed="${cdPicked===n}" ${have.has(n.toLowerCase())?'disabled aria-label="'+esc(n)+' (já existe)"':""}>${cardBadge(n)}<span>${esc(n)}</span></button>`;
  const pal=CARD_PALETTE.includes(cdColor)?CARD_PALETTE:[cdColor,...CARD_PALETTE.slice(0,-1)];
  return `<div class="grip"></div><h3><span>Novo cartão</span><button type="button" class="x" data-close aria-label="Fechar">✕</button></h3>
  <div class="field"><span class="lbl">Banco ou loja</span><div class="bpick">${BANK_PICK.map(btn).join("")}<span class="bsub">Contas de câmbio</span>${FX_PICK.map(btn).join("")}<span class="bsub">Vale-refeição e alimentação</span>${BEN_PICK.map(btn).join("")}
    <button type="button" data-bpick="" aria-pressed="${cdPicked===""}"><span class="fi" style="background:var(--chip);color:var(--ink)">+</span><span>Outro</span></button></div></div>
  <div class="field" ${cdPicked===""?"":"hidden"}><label for="cdName">Nome do cartão</label><input type="text" id="cdName" placeholder="Ex.: Nubank, C6, Itaú" maxlength="20" value="${esc(cdName)}"></div>
  <div class="field"><span class="lbl">Cor</span><div class="swatches">${pal.map(c=>`<button type="button" class="swatch" data-color="${c}" style="background:${c}" aria-label="Cor ${c}" aria-pressed="${c===cdColor}"></button>`).join("")}</div></div>
  <p class="err" id="cdErr"></p>
  <button type="button" class="btn primary wide" id="cdSave">Criar cartão</button>`;
}
function openCardSheet(){
  const used=new Set(cardNames().map(cardColor));cdColor=CARD_PALETTE.find(c=>!used.has(c))||CARD_PALETTE[0];cdPicked=null;cdName="";
  openSheet(cardSheetHtml());
}
document.addEventListener("click",e=>{
  if(!$("sheet").querySelector("#cdSave"))return;
  const b=e.target.closest("[data-bpick]");
  if(b&&!b.disabled){cdPicked=b.dataset.bpick;if(cdPicked){cdName=cdPicked;const k=bankOf(cdPicked);if(k)cdColor=k.c}else cdName="";
    openSheet(cardSheetHtml());if(cdPicked==="")setTimeout(()=>$("cdName")?.focus(),60);return}
  const s=e.target.closest("[data-color]");if(s){cdColor=s.dataset.color;const nm=$("cdName");if(nm)cdName=nm.value;openSheet(cardSheetHtml());return}
  if(e.target.closest("#cdSave")){
    const nm=$("cdName"),name=(cdPicked===""?(nm?nm.value:""):cdName).trim().replace(/\s+/g," ");
    if(cdPicked===null){$("cdErr").textContent="Escolha o banco ou toque em Outro.";return}
    if(!name){$("cdErr").textContent="Dê um nome ao cartão.";return}
    if(name.toLowerCase()==="outro"||cardNames().some(c=>c.toLowerCase()===name.toLowerCase())){$("cdErr").textContent="Já existe um cartão com esse nome.";return}
    cards[name]={color:cdColor};sel=name;saveCards();closeSheet();renderCards();toast("Cartão "+name+" criado");
  }
});

/* ---------- ler PDF ---------- */
const READS=[["Faturas de cartão","Inter, Pan, PicPay e Renner/Realize"],
  ["Contas e boletos","Claro, Vivo, TIM, Oi, Enel, CPFL, Elektro, Sabesp e Comgás"],
  ["Holerite","demonstrativo de pagamento (salário, adiantamento, 13º, férias) com o extrato do convênio"]];
$("reads").innerHTML=READS.map(([a,b])=>`<div><b>${a}</b><small>${b}</small></div>`).join("")+`<small style="color:var(--muted)">Use sempre o PDF original do banco, sem converter, comprimir ou escanear. O PDF é lido no próprio aparelho.</small>`;

async function openPdf(file){
  let bytes=new Uint8Array(await file.arrayBuffer());const info=pdfInfo(bytes,file);
  if(info.off>0) bytes=bytes.subarray(info.off); /* alguns apps põem lixo antes do %PDF */
  const L=await loadPdfJs(), task=L.getDocument({data:bytes});
  task.onPassword=(cb,reason)=>{info.senha=(info.senha||0)+1;const pw=prompt(reason===2?"Senha incorreta. Digite a senha do PDF:":"Este PDF tem senha. Digite a senha (geralmente parte do CPF):");if(pw==null){info.cancelou=1;task.destroy();return}cb(pw)};
  const doc=await task.promise, pages=[];
  for(let n=1;n<=doc.numPages;n++){const pg=await doc.getPage(n),vp=pg.getViewport({scale:1}),tc=await pg.getTextContent();
    pages.push({h:vp.height,w:vp.width,items:tc.items.map(i=>({s:i.str,x:i.transform[4],w:i.width,t:vp.height-i.transform[5]}))})}
  return {pages,info};
}
/* um PDF → {kind:"holerite"|"fatura"|"conta"|"erro", ...}; ordem do app anterior: holerite, fatura, conta */
async function readOne(file){
  const out={name:file.name};let pdf=null;
  try{
    pdf=await openPdf(file);out.pdf=pdf;lastPdf=pdf;
    if(!pdf.pages.some(pg=>pg.items.some(i=>i.s.trim()))){out.kind="erro";out.msg=`Esse PDF não tem texto, só imagem${/ilovepdf|scan|camscanner|adobe scan/i.test(pdf.info.producer)?` (passou pelo ${pdf.info.producer})`:""}. Use o PDF original do banco, sem converter, comprimir ou escanear.`;return out}
    const h=parseHolerite(pdf.pages);if(h){out.kind="holerite";out.h=h;return out}
    const r=parseInvoice(pdf.pages);pdf.res=r;
    if(r.rows.length){out.kind="fatura";out.r=r;return out}
    const c=parseConta(pdf.pages);if(c){out.kind="conta";out.c=c;return out}
    out.kind="erro";out.msg="Não reconheci esse PDF como fatura de cartão, conta ou holerite.";return out;
  }catch(e){
    out.kind="erro";
    if(e&&e.message==="offline")out.msg="Sem internet para carregar o leitor de PDF.";
    else if(pdf&&pdf.info&&pdf.info.cancelou)out.msg="Leitura cancelada.";
    else{out.msg=pdf?"O leitor travou nesse PDF.":"Não deu para abrir esse PDF.";lastPdf={pages:(pdf&&pdf.pages)||[],info:pdf&&pdf.info,err:`${e&&e.name||"Erro"}: ${e&&e.message||e}`};out.pdf=lastPdf}
    return out}
}
const fmtDM=d=>d?d.slice(8)+"/"+d.slice(5,7):"";
function viewFatura(x){
  const r=x.r, sum=r.rows.reduce((s,y)=>s+y.cents,0), b=bankOf(r.bank||"");
  const chk=r.total==null?"":Math.abs(sum-r.total)<=1?`<span class="ok">bate com o total do banco ✓</span>`:`<span class="bad">banco diz ${R(r.total)}</span>`;
  const nm=y=>{let n=(y.shop||y.desc||"").trim();if(n&&n===n.toUpperCase()&&/[A-Z]{3}/.test(n))n=titleCase(n);return n};
  return `<details class="rd" open><summary><span>${r.bank?cardBadge(r.bank)+" ":""}Fatura ${esc(r.bank||"")} <small>${esc(x.name)}</small></span></summary>
    <div class="kv"><span>Vencimento</span><b>${r.due?fmtD(r.due):"não achei"}</b>${r.close?`<span>Fecha dia</span><b>${r.close}</b>`:""}<span>Lançamentos</span><b>${r.rows.length}</b><span>Soma lida</span><b>${R(sum)}</b>${r.total!=null?`<span>Total do banco</span><b>${R(r.total)}</b>`:""}</div>
    ${chk?`<div class="kv" style="padding-top:0"><span>Conferência</span><b>${chk}</b></div>`:""}
    ${r.rows.map(y=>`<div class="ln"><span>${fmtDM(y.date)}</span><span class="dsc">${esc(nm(y))}</span><b class="${y.cents<0?"cr":""}">${R(y.cents)}</b></div>`).join("")}</details>`;
}
function viewConta(x){const c=x.c;
  return `<details class="rd" open><summary><span>Conta ${esc(c.name)} <small>${esc(x.name)}</small></span></summary>
    <div class="kv"><span>Empresa</span><b>${esc(c.name)}</b><span>Vencimento</span><b>${fmtD(c.due)}</b><span>Valor</span><b>${R(c.cents)}</b><span>Débito automático</span><b>${c.auto?"sim":"não"}</b></div></details>`}
/* nome do evento do holerite: siglas (PLR, I.N.S.S.) ficam em maiúsculas */
const hlName=d=>d.split(/(\s+)/).map(w=>/^(?:\p{L}\.)+\p{L}?\.?$|^\p{Lu}{2,3}$/u.test(w)&&!/^(DE|DO|DA|E)$/.test(w)?w:titleCase(w)).join("");
function viewHolerite(x){const h=x.h;
  const P=h.ev.filter(e=>e.side==="p"), D=h.ev.filter(e=>e.side==="d");
  return `<details class="rd" open><summary><span>Holerite · ${esc(h.kind)} <small>${esc(x.name)}</small></span></summary>
    <div class="kv"><span>Líquido</span><b>${R(h.cents)}</b><span>Crédito em</span><b>${fmtD(h.date)}</b><span>Referência</span><b>${h.ref.slice(5)}/${h.ref.slice(0,4)}</b>${h.emp?`<span>Empresa</span><b>${esc(h.emp)}</b>`:""}
      ${h.tp!=null?`<span>Proventos</span><b>${R(h.tp)}</b>`:""}${h.td!=null?`<span>Descontos</span><b>${R(h.td)}</b>`:""}
      ${h.check==null?"":`<span>Conferência</span><b>${h.check?`<span class="ok">proventos − descontos = líquido ✓</span>`:`<span class="bad">não bate com o líquido</span>`}</b>`}
      ${h.conv?`<span>Convênio</span><b>${R(h.conv.cents)}${h.conv.n?` · ${h.conv.n} atend.`:""}</b>`:""}</div>
    ${h.conv&&h.conv.by&&h.conv.by.length?h.conv.by.map(b=>`<div class="ln h2"><span>${esc(b.k)} · ${b.n}</span><b>${R(b.cents)}</b></div>`).join(""):""}
    ${P.length?`<div class="ln sub">Proventos</div>`+P.map(e=>`<div class="ln h2"><span class="dsc" style="color:var(--ink);font-size:.92rem">${esc(hlName(e.desc))}</span><b>${R(e.cents)}</b></div>`).join(""):""}
    ${D.length?`<div class="ln sub">Descontos</div>`+D.map(e=>`<div class="ln h2"><span class="dsc" style="color:var(--ink);font-size:.92rem">${esc(hlName(e.desc))}</span><b>${R(e.cents)}</b></div>`).join(""):""}</details>`}
function viewErro(x,i){
  return `<details class="rd" open><summary><span>${esc(x.name)}</span></summary><p class="err" style="display:block">${esc(x.msg)}</p>${x.pdf?`<button type="button" class="btn" data-diag="${i}" style="margin-bottom:12px">Ver diagnóstico</button>`:""}</details>`}
let results=[];
function showResults(){
  openSheet(`<div class="grip"></div><h3><span>O que o app leu</span><button type="button" class="x" data-close aria-label="Fechar">✕</button></h3>`+
    results.map((x,i)=>x.kind==="fatura"?viewFatura(x):x.kind==="conta"?viewConta(x):x.kind==="holerite"?viewHolerite(x):viewErro(x,i)).join(""));
}
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-diag]");if(d){lastPdf=results[+d.dataset.diag].pdf;
    openSheet(`<div class="grip"></div><h3><span>Diagnóstico</span><button type="button" class="x" data-close aria-label="Fechar">✕</button></h3>
    <p class="hint" style="margin:0 0 10px;color:var(--muted);font-size:.88rem">Copie e cole no Claude para ajustar o leitor. Nomes viram “Xxxx” e números longos viram “#”; datas e valores ficam.</p>
    <textarea id="diagTxt" class="diagtxt" readonly rows="12">${esc(diagText())}</textarea>
    <button type="button" class="btn primary wide" id="diagCopy" style="margin-top:10px">Copiar diagnóstico</button>`);return}
  if(e.target.closest("#diagCopy")){const ta=$("diagTxt");
    (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>toast("Copiado. Cole no Claude.")).catch(()=>{ta.focus();ta.setSelectionRange(0,ta.value.length);let ok=false;try{ok=document.execCommand("copy")}catch(_){}toast(ok?"Copiado. Cole no Claude.":"Selecione o texto e copie.")})}
});
$("pdfIn").addEventListener("change",async e=>{
  const files=[...e.target.files];e.target.value="";if(!files.length)return;
  toast(files.length>1?`Lendo ${files.length} PDFs…`:"Lendo o PDF…");results=[];
  for(const f of files)results.push(await readOne(f));
  $("toast").hidden=true;showResults();
});

renderCards();
if(PWA&&"serviceWorker" in navigator&&(location.protocol==="https:"||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))) navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update()})}).catch(()=>{});
/* iOS: no app da tela de início o touch-action às vezes é ignorado. O 2º toque rápido no mesmo lugar vira um clique normal (sem zoom); campos de texto ficam de fora. Também bloqueia a pinça. */
(()=>{let last=0,lx=0,ly=0;
  document.addEventListener("touchend",e=>{const t=e.changedTouches&&e.changedTouches[0];if(!t)return;const n=Date.now();
    if(n-last<350&&Math.abs(t.clientX-lx)<40&&Math.abs(t.clientY-ly)<40&&!e.target.closest("input,textarea,select,[contenteditable]")){e.preventDefault();(e.target.closest("button,a,label")||e.target).click()}
    last=n;lx=t.clientX;ly=t.clientY},{passive:false});
  ["gesturestart","gesturechange"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
})();
</script>
